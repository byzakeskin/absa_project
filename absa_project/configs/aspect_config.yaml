# Sentiment lexicon additions (domain-specific)
domain_sentiment_lexicon:
  turkish:
    positive: ["kaliteli", "güzel", "harika", "mükemmel", "şık", "rahat", "sağlam", "tam beden", "beğendim", "tavsiye"]
    negative: ["kalitesiz", "dar geldi", "büyük geldi", "ince", "şeffaf", "vurdu", "bozuldu", "hayal kırıklığı", "iade", "pişman"]
  english:
    positive: ["quality", "great", "perfect", "comfortable", "fits well", "true to size", "recommend", "love it"]
    negative: ["poor quality", "runs small", "runs large", "see-through", "blisters", "broke", "disappointed", "returned"]
